<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Notch CRM</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(460px,100%);background:white;padding:24px;border-radius:18px;box-shadow:0 10px 30px #0002}h1{margin:0 0 8px}.muted{color:#6b7280}.users{display:grid;gap:12px;margin:20px 0}.user{padding:16px;border:2px solid #d1d5db;border-radius:12px;background:white;color:#111827;font-size:18px;font-weight:700}.user.selected{border-color:#111827;background:#f3f4f6}.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pinpad button,.signin,.logout{padding:15px;border:0;border-radius:10px;background:#111827;color:white;font-size:18px;font-weight:700}.display{text-align:center;font-size:28px;letter-spacing:8px;min-height:42px;margin:14px 0}.signin{width:100%;margin-top:14px}.msg{min-height:24px;color:#b91c1c;font-weight:700}.app{display:none;padding:20px}.dash{max-width:900px;margin:auto}.top{background:#111827;color:white;padding:22px;border-radius:16px}.ok{background:#ecfdf5;border:1px solid #10b981;padding:18px;border-radius:14px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}.tile{background:white;padding:18px;border-radius:12px}.logout{margin-top:18px}.build{font-size:13px}</style></head><body><div id="login" class="wrap"><div class="card"><h1>Top Notch CRM</h1><p class="muted">Select your name, then use the on-screen keypad.</p><div class="users"><button class="user" data-user="Jeff">Jeff — Owner</button><button class="user" data-user="Stan">Stan — Technician</button><button class="user" data-user="Louis">Louis — Technician</button></div><div id="display" class="display">----</div><div class="pinpad"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button id="clear">Clear</button><button data-n="0">0</button><button id="back">⌫</button></div><button id="signin" class="signin">Sign In</button><p id="msg" class="msg"></p><p class="muted build">ROLE LOGIN TEST BUILD 7 — test PIN 1234</p></div></div><div id="app" class="app"><div class="dash"><div class="top"><h1>Top Notch CRM</h1><p id="who"></p></div><div class="ok"><strong>LOGIN SUCCESSFUL</strong><p>The role login is working on this device. This remains a test build; do not enter customer data yet.</p></div><div class="grid"><div class="tile"><strong>Open Jobs</strong><p>0</p></div><div class="tile"><strong>Scheduled</strong><p>0</p></div><div class="tile"><strong>Customers</strong><p>0</p></div></div><button id="logout" class="logout">Sign Out</button></div></div><script>(function(){var selected='',pin='';var login=document.getElementById('login'),app=document.getElementById('app'),display=document.getElementById('display'),msg=document.getElementById('msg'),who=document.getElementById('who');function draw(){display.textContent=pin?Array(pin.length+1).join('•'):'----'}document.querySelectorAll('.user').forEach(function(b){b.onclick=function(){selected=b.getAttribute('data-user');document.querySelectorAll('.user').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected');msg.textContent=''}});document.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){if(pin.length<6){pin+=b.getAttribute('data-n');draw()}}});document.getElementById('clear').onclick=function(){pin='';draw()};document.getElementById('back').onclick=function(){pin=pin.slice(0,-1);draw()};document.getElementById('signin').onclick=function(){if(!selected){msg.textContent='Select your name first.';return}if(pin!=='1234'){msg.textContent='Incorrect test PIN.';return}var role=selected==='Jeff'?'Owner / Administrator':'Technician';who.textContent=selected+' • '+role;login.style.display='none';app.style.display='block';msg.textContent=''};document.getElementById('logout').onclick=function(){app.style.display='none';login.style.display='flex';pin='';selected='';draw();document.querySelectorAll('.user').forEach(function(x){x.classList.remove('selected')})};draw()})();</script></body></html>
