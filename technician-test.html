<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Notch CRM Technician Test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}button{font:inherit}.wrap{max-width:720px;margin:auto;padding:18px}.top{background:#111827;color:white;padding:22px;border-radius:0 0 18px 18px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}.login{min-height:100vh;display:flex;align-items:center}.users,.pad{display:grid;gap:10px}.users{grid-template-columns:1fr 1fr}.pad{grid-template-columns:repeat(3,1fr);margin-top:14px}.btn{border:0;border-radius:11px;padding:15px;font-weight:700;background:#111827;color:white}.light{background:#e5e7eb;color:#111827}.selected{outline:3px solid #2563eb}.pin{text-align:center;font-size:28px;letter-spacing:8px;margin:14px}.app{display:none}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5e7eb;font-weight:700;font-size:13px}.job h2{margin-bottom:6px}.meta{line-height:1.6;color:#374151}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.accepted{background:#dbeafe}.progress{background:#fef3c7}.done{background:#dcfce7}.notice{background:#eff6ff;border:1px solid #93c5fd;border-radius:12px;padding:13px;margin:14px 0}.small{font-size:13px;color:#6b7280}.logout{float:right;background:#374151}.empty{text-align:center;color:#6b7280;padding:30px}</style></head><body><div id="login" class="login"><div class="wrap" style="width:100%"><div class="card"><h1>Top Notch CRM</h1><p>Technician workflow test</p><div class="users"><button class="btn light user" data-user="Stan">Stan</button><button class="btn light user" data-user="Louis">Louis</button></div><div id="pin" class="pin">----</div><div class="pad"><button class="btn" data-n="1">1</button><button class="btn" data-n="2">2</button><button class="btn" data-n="3">3</button><button class="btn" data-n="4">4</button><button class="btn" data-n="5">5</button><button class="btn" data-n="6">6</button><button class="btn" data-n="7">7</button><button class="btn" data-n="8">8</button><button class="btn" data-n="9">9</button><button id="clear" class="btn light">Clear</button><button class="btn" data-n="0">0</button><button id="back" class="btn light">⌫</button></div><button id="signin" class="btn" style="width:100%;margin-top:12px">Sign In</button><p id="msg"></p><p class="small">Test PIN 1234. Demo information only.</p></div></div></div><div id="app" class="app"><div class="top"><button id="logout" class="btn logout">Sign Out</button><h1>Top Notch CRM</h1><p id="who"></p></div><div class="wrap"><div class="notice"><strong>My Assigned Jobs</strong><br>Only jobs assigned to this technician appear here. Tap Accept, Start, or Complete as work progresses.</div><div id="summary" class="card"></div><div id="jobs"></div></div></div><script>(function(){var selected='',p='';var demo=[{id:'JOB-T101',tech:'Stan',service:'Replace Kitchen Faucet',customer:'Demo Customer A',address:'123 Demo Street, Lompoc',when:'Monday • 9:00 AM',notes:'Customer has new faucet on site.',status:'Scheduled'},{id:'JOB-T102',tech:'Stan',service:'Install Ceiling Fan',customer:'Demo Customer B',address:'456 Sample Avenue, Lompoc',when:'Monday • 1:30 PM',notes:'Existing ceiling box. Verify support before install.',status:'Scheduled'},{id:'JOB-T201',tech:'Louis',service:'Repair Door Hardware',customer:'Demo Customer C',address:'789 Test Road, Santa Maria',when:'Tuesday • 10:00 AM',notes:'Inspect latch and strike alignment.',status:'Scheduled'},{id:'JOB-T202',tech:'Louis',service:'Replace Smoke Detector',customer:'Demo Customer D',address:'321 Example Lane, Lompoc',when:'Tuesday • 2:00 PM',notes:'Replacement unit supplied for demo.',status:'Scheduled'}];var saved=JSON.parse(localStorage.getItem('tncrm-tech-test')||'{}');demo.forEach(function(j){if(saved[j.id])j.status=saved[j.id]});function draw(){document.getElementById('pin').textContent=p?'•'.repeat(p.length):'----'}document.querySelectorAll('.user').forEach(function(b){b.onclick=function(){selected=b.dataset.user;document.querySelectorAll('.user').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}});document.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){if(p.length<6)p+=b.dataset.n;draw()}});clear.onclick=function(){p='';draw()};back.onclick=function(){p=p.slice(0,-1);draw()};signin.onclick=function(){if(!selected){msg.textContent='Select Stan or Louis.';return}if(p!=='1234'){msg.textContent='Incorrect test PIN.';return}login.style.display='none';app.style.display='block';who.textContent=selected+' • Technician';render()};logout.onclick=function(){app.style.display='none';login.style.display='flex';p='';selected='';msg.textContent='';draw();document.querySelectorAll('.user').forEach(x=>x.classList.remove('selected'))};function setStatus(id,s){var j=demo.find(x=>x.id===id);if(j){j.status=s;saved[id]=s;localStorage.setItem('tncrm-tech-test',JSON.stringify(saved));render()}}function render(){var list=demo.filter(j=>j.tech===selected);var open=list.filter(j=>j.status!=='Completed').length,done=list.filter(j=>j.status==='Completed').length;summary.innerHTML='<strong>Today / Upcoming</strong><p>'+open+' open assigned job'+(open===1?'':'s')+' • '+done+' completed</p>';jobs.innerHTML=list.map(function(j){var cls=j.status==='Completed'?'done':j.status==='In Progress'?'progress':j.status==='Accepted'?'accepted':'';return '<div class="card job '+cls+'"><span class="badge">'+j.status+'</span><h2>'+j.service+'</h2><div class="meta"><strong>'+j.customer+'</strong><br>'+j.address+'<br><strong>'+j.when+'</strong><br>'+j.notes+'</div><div class="actions"><button class="btn light act" data-id="'+j.id+'" data-s="Accepted">Accept</button><button class="btn light act" data-id="'+j.id+'" data-s="In Progress">Start</button><button class="btn act" data-id="'+j.id+'" data-s="Completed">Complete</button></div></div>'}).join('')||'<div class="card empty">No assigned jobs.</div>';document.querySelectorAll('.act').forEach(function(b){b.onclick=function(){setStatus(b.dataset.id,b.dataset.s)}})}})();</script></body></html>
